name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - v1-ui-redesign

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Validate Python source
        shell: powershell
        run: |
          python -m py_compile run.py signprint_ai\app.py signprint_ai\processing.py signprint_ai\pipeline.py signprint_ai\realesrgan_ncnn.py tools\generate_brand_assets.py
      - name: Build
        shell: powershell
        run: .\build_windows.ps1
      - name: Verify AI backend is packaged
        shell: powershell
        run: |
          $exe = ".\dist\NiyomsilAIEnhancer\tools\realesrgan-ncnn-vulkan.exe"
          if (-not (Test-Path $exe)) { throw "Missing packaged Real-ESRGAN backend" }
          if (-not (Test-Path ".\dist\NiyomsilAIEnhancer\tools\models")) { throw "Missing packaged Real-ESRGAN models" }
          Get-Item $exe | Format-List FullName,Length
      - name: Create installer checksum
        shell: powershell
        run: |
          $installer = ".\release\Niyomsil-Design-v1.0-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer missing before checksum" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          "$hash  Niyomsil-Design-v1.0-Setup.exe" | Set-Content ".\release\Niyomsil-Design-v1.0-Setup.exe.sha256.txt" -Encoding ascii
          Get-Item $installer | Format-List FullName,Length
          Get-Content ".\release\Niyomsil-Design-v1.0-Setup.exe.sha256.txt"

      - name: Upload installer only
        uses: actions/upload-artifact@v4
        with:
          name: Niyomsil-Design-v1.0-Installer
          compression-level: 0
          path: |
            release\Niyomsil-Design-v1.0-Setup.exe
            release\Niyomsil-Design-v1.0-Setup.exe.sha256.txt
