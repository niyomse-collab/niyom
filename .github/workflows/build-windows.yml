name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/niyomsil-independent-core
      - release/niyomsil-design-v1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Independent Core regression checks
        run: |
          python -m pip install pytest numpy Pillow "opencv-python-headless<5"
          python -m pytest -q

      - name: Check preview space at desktop window sizes
        run: python -c "from signprint_ai.ui_smoke import run; run(layout_only=True)"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Validate NiyomSilp UI and independent core source
        shell: powershell
        run: |
          python -m py_compile run.py signprint_ai\app_v2.py signprint_ai\niyomsil_core_adapter.py signprint_ai\arm_core_adapter.py signprint_ai\face_module\__init__.py signprint_ai\face_module\face_protection.py signprint_ai\independent_core.py tools\generate_brand_assets.py

      - name: Build NiyomSilp Design v1 installer
        shell: powershell
        run: .\build_windows.ps1

      - name: Smoke-test packaged EXE imports
        shell: powershell
        run: |
          $exe = ".\\dist\\NiyomsilAIEnhancer\\NiyomsilAIEnhancer.exe"
          if (-not (Test-Path $exe)) { throw "Missing packaged EXE before smoke test" }
          $env:NIYOMSIL_IMPORT_SMOKE = "1"
          $proc = Start-Process -FilePath $exe -PassThru -Wait
          Remove-Item Env:NIYOMSIL_IMPORT_SMOKE -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            throw "Packaged EXE import smoke test failed with exit code $($proc.ExitCode)"
          }
          Write-Host "Packaged EXE import smoke test passed."

      - name: Smoke-test packaged preview, device, face dialog and detector
        shell: powershell
        run: |
          $env:NIYOMSIL_UI_SMOKE = "1"
          $proc = Start-Process -FilePath ".\dist\NiyomsilAIEnhancer\NiyomsilAIEnhancer.exe" -PassThru
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); throw "UI/detector smoke test timed out" }
          Remove-Item Env:NIYOMSIL_UI_SMOKE -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "UI/detector smoke test failed" }

      - name: Smoke-test packaged Face Protect backend
        shell: powershell
        run: |
          $exe = ".\\dist\\NiyomsilAIEnhancer\\NiyomsilAIEnhancer.exe"
          if (-not (Test-Path $exe)) { throw "Missing packaged EXE before Face Protect smoke test" }
          $env:NIYOMSIL_FACE_BACKEND_SMOKE = "1"
          $proc = Start-Process -FilePath $exe -PassThru -Wait
          Remove-Item Env:NIYOMSIL_FACE_BACKEND_SMOKE -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            throw "Packaged Face Protect backend smoke test failed with exit code $($proc.ExitCode)"
          }
          Write-Host "Packaged Face Protect backend smoke test passed."

      - name: Verify NiyomSilp core package and model checksums
        shell: powershell
        run: |
          $exe = ".\dist\NiyomsilAIEnhancer\NiyomsilAIEnhancer.exe"
          $model = ".\dist\NiyomsilAIEnhancer\_internal\models\RealESRGAN_x4plus.pth"
          $gfpgan = ".\dist\NiyomsilAIEnhancer\_internal\models\face\GFPGANv1.4.pth"
          $retina = ".\dist\NiyomsilAIEnhancer\_internal\models\face\detection_Resnet50_Final.pth"
          $proof = ".\dist\NiyomsilAIEnhancer\ARM_CORE_BUILD_PROOF.txt"
          if (-not (Test-Path $exe)) { throw "Missing V2.1 executable" }
          if (-not (Test-Path $model)) { throw "Missing ARM RealESRGAN_x4plus model" }
          if (-not (Test-Path $gfpgan)) { throw "Missing GFPGANv1.4 model" }
          if (-not (Test-Path $retina)) { throw "Missing RetinaFace detector model" }
          if (-not (Test-Path $proof)) { throw "Missing ARM core build proof" }

          $expected = "4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1"
          $actual = (Get-FileHash -Algorithm SHA256 $model).Hash.ToLower()
          if ($actual -ne $expected) { throw "Packaged model SHA256 mismatch: $actual" }

          $expectedGfpgan = "e2cd4703ab14f4d01fd1383a8a8b266f9a5833dacee8e6a79d3bf21a1b6be5ad"
          $actualGfpgan = (Get-FileHash -Algorithm SHA256 $gfpgan).Hash.ToLower()
          if ($actualGfpgan -ne $expectedGfpgan) { throw "Packaged GFPGAN SHA256 mismatch: $actualGfpgan" }

          $expectedRetina = "6d1de9c2944f2ccddca5f5e010ea5ae64a39845a86311af6fdf30841b0a5a16d"
          $actualRetina = (Get-FileHash -Algorithm SHA256 $retina).Hash.ToLower()
          if ($actualRetina -ne $expectedRetina) { throw "Packaged RetinaFace SHA256 mismatch: $actualRetina" }

          if (Test-Path ".\dist\NiyomsilAIEnhancer\tools\realesrgan-ncnn-vulkan.exe") {
            throw "NCNN backend must not be packaged in V2 ARM Core build"
          }

          Get-Item $exe | Format-List FullName,Length
          Get-Item $model | Format-List FullName,Length
          Get-Content $proof

      - name: Verify installer and checksum
        shell: powershell
        run: |
          $installer = ".\release\NiyomSilp-Design-v1-Setup.exe"
          $checksum = ".\release\NiyomSilp-Design-v1-Setup.exe.sha256.txt"
          if (-not (Test-Path $installer)) { throw "Missing NiyomSilp v1 installer" }
          if (-not (Test-Path $checksum)) { throw "Missing installer checksum" }
          Get-Item $installer | Format-List FullName,Length
          Get-Content $checksum

      - name: Upload NiyomSilp Design v1 installer
        uses: actions/upload-artifact@v4
        with:
          name: NiyomSilp-Design-v1-Windows
          compression-level: 0
          path: |
            release\NiyomSilp-Design-v1-Setup.exe
            release\NiyomSilp-Design-v1-Setup.exe.sha256.txt
            dist\NiyomsilAIEnhancer\ARM_CORE_BUILD_PROOF.txt

  publish-stable-v1:
    name: Publish accepted NiyomSilp Design v1 release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: NiyomSilp-Design-v1-Windows
          path: downloaded
      - name: Publish v1.0.1 release with checksummed installer parts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.0.1'
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to overwrite."
            exit 0
          fi
          installer='NiyomSilp-Design-v1-Setup.exe'
          source_dir='downloaded/release'
          test -f "$source_dir/$installer"
          test -f "$source_dir/$installer.sha256.txt"
          test -f 'tools/Restore-NiyomSilp-Installer.ps1'
          (cd "$source_dir" && sha256sum -c "$installer.sha256.txt")
          mkdir -p release-assets
          # Each release asset must remain under GitHub's 2 GiB per-file limit.
          split --bytes=1800M --numeric-suffixes=1 --suffix-length=2 \
            "$source_dir/$installer" "release-assets/$installer.part"
          cp "$source_dir/$installer.sha256.txt" release-assets/
          cp tools/Restore-NiyomSilp-Installer.ps1 release-assets/
          cp THIRD_PARTY_NOTICES.md release-assets/
          (cd release-assets && sha256sum "$installer".part* > PARTS_SHA256.txt)
          gh release create "$tag" release-assets/* \
            --repo "$REPO" \
            --title 'NiyomSilp Design v1 (1.0.1) — Stable Windows' \
            --notes-file RELEASE_NOTES_V1_0_1.md \
            --target "$GITHUB_SHA" \
            --latest
          echo "Release published: https://github.com/$REPO/releases/tag/$tag"
