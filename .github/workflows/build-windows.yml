name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: powershell
        run: .\build_windows.ps1
      - name: Verify AI backend is packaged
        shell: powershell
        run: |
          $exe = ".\dist\SignPrintAIEnhancer\tools\realesrgan-ncnn-vulkan.exe"
          if (-not (Test-Path $exe)) { throw "Missing packaged Real-ESRGAN backend" }
          if (-not (Test-Path ".\dist\SignPrintAIEnhancer\tools\models")) { throw "Missing packaged Real-ESRGAN models" }
          Get-Item $exe | Format-List FullName,Length
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SignPrint-AI-Enhancer-Windows
          path: |
            release\*.exe
            dist\SignPrintAIEnhancer\**
