name: V2.1.1 portrait safety regression

on:
  push:
    branches:
      - feature/v2.1.1-super-ai
  pull_request:
    branches:
      - dev/niyomsil-design-v2
  workflow_dispatch:

jobs:
  face-contract:
    name: Face export contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated source-test dependencies (no model weights)
        run: python -m pip install pytest numpy Pillow opencv-python-headless "pyvips[binary]>=3.2,<4" tifffile pypdf
      - name: Compile V2.1.1 source
        run: python -m compileall -q signprint_ai tests
      - name: Verify V2.1.1 face safety and HAT export regressions
        run: python -m pytest tests/test_v211_face_contract.py tests/test_v211_hat_engine.py tests/test_v211_hat_border_tiles.py tests/test_v211_hat_alpha_export.py tests/test_v211_hat_exif_orientation.py tests/test_v211_model_preflight.py tests/test_v211_hat_assist.py tests/test_v211_hat_assist_color.py tests/test_v211_hat_quality_gate.py tests/test_v211_ab_report.py tests/test_v211_generate_ab.py tests/test_v211_swinir_preprocess.py tests/test_v211_nafnet_deblur.py tests/test_v211_true_hr_benchmark.py tests/test_v21_face_quality_guard.py tests/test_face_mode_ui.py -q
