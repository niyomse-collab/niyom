name: Provision four AI engines (experimental)
on:
  workflow_dispatch:
jobs:
  fetch-engines:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Windows engine archives independently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force engines | Out-Null
          $sources = @(
            @{name='real-esrgan'; repo='nihui/realesrgan-ncnn-vulkan'},
            @{name='waifu2x'; repo='nihui/waifu2x-ncnn-vulkan'},
            @{name='real-cugan'; repo='nihui/realcugan-ncnn-vulkan'},
            @{name='anime4k'; repo='TianZerL/Anime4KCPP'}
          )
          $manifest = @()
          foreach ($source in $sources) {
            $name = $source.name
            try {
              $url = "https://api.github.com/repos/$($source.repo)/releases?per_page=30"
              $releases = @(Invoke-RestMethod -Uri $url -Headers @{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='NiyomSilp-Provision'})
              $asset = $null
              $tag = ''
              foreach ($release in $releases) {
                $asset = $release.assets | Where-Object { $_.name -match '(?i)(win|windows)' -and $_.name -match '\.(zip|7z)$' } | Select-Object -First 1
                if ($asset) { $tag = $release.tag_name; break }
              }
              if (-not $asset) { throw "No Windows archive found in latest 30 releases" }
              $target = Join-Path engines "$name-$($asset.name)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $target
              $hash = (Get-FileHash -Path $target -Algorithm SHA256).Hash
              $manifest += [pscustomobject]@{engine=$name; status='downloaded'; repository=$source.repo; version=$tag; asset=$asset.name; sha256=$hash}
              Write-Host "Downloaded $name"
            } catch {
              Write-Warning "$name : $_"
              $manifest += [pscustomobject]@{engine=$name; status='failed'; repository=$source.repo; error="$($_.Exception.Message)"}
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content engines/manifest.json
          if (-not ($manifest | Where-Object status -eq 'downloaded')) { throw "No engine downloaded. Inspect manifest.json in the workflow log." }
      - name: Upload available archives and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niyomsil-four-ai-engines-windows
          path: engines/
          retention-days: 7
