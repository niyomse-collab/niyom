name: Independent Core — UI Freeze and Engine Contract
on:
  push:
    branches:
      - dev-niyomsil-independent-core-20261010
  workflow_dispatch:

jobs:
  source-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test requirements
        run: python -m pip install numpy pillow
      - name: Syntax validation
        run: python -m compileall -q independent_core tests/test_independent_core.py
      - name: Verify original UI/buttons/backend unchanged and independent engine contracts
        run: python -m unittest discover -s tests -p 'test_independent_core.py' -v
