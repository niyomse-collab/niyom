name: Independent Core — UI and Baseline Guards

on:
  push:
    branches:
      - dev-niyomsil-independent-core-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test requirements
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python==5.0.0.93
      - name: Syntax validation
        run: python -m compileall -q independent_core tests tools/run_shop_icc.py tools/run_gpu_parity.py
      - name: Verify UI frozen, output geometry, ICC failure-safe, external ICC selection
        run: |
          python -m unittest discover -s tests -p 'test_independent_core.py' -v
          python -m unittest discover -s tests -p 'test_print_contract.py' -v
          python -m unittest discover -s tests -p 'test_shop_icc.py' -v
          python -m unittest discover -s tests -p 'test_icc_library.py' -v
          python -m unittest discover -s tests -p 'test_zip_cmyk_export.py' -v
          python -m unittest discover -s tests -p 'test_desktop_adapter.py' -v
