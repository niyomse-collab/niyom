name: Build and verify NiyomSilp v2 Windows

on:
  workflow_dispatch:
  push:
    branches: [dev/niyomsil-design-v2]
    paths:
      - '.github/workflows/build-v2-windows.yml'
      - 'build_windows.ps1'
      - 'installer_v2*'
      - 'NiyomsilV2ArmCore.spec'
      - 'run.py'
      - 'signprint_ai/**'
      - 'tools/Test-V2-Package.ps1'
      - 'tools/generate_v2_download_installer.py'
      - 'requirements*.txt'

concurrency:
  group: niyomsil-v2-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      V2_VERSION: 2.0.0-beta.${{ github.run_number }}
      V2_TAG: v2-large-images-${{ github.run_number }}
      PIP_NO_CACHE_DIR: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test sources before packaging
        run: |
          python -m pip install pytest numpy Pillow opencv-python-headless pypdf -r requirements_v2_large_images.txt
          python -m pytest -q
          python -m compileall -q signprint_ai tools run.py
          python -c "from signprint_ai.ui_smoke import run; run(layout_only=True)"

      - name: Install compiler
        run: choco install innosetup -y --no-progress

      - name: Build v2 runtime and full installer
        shell: powershell
        run: .\build_windows.ps1 -Channel v2 -Version $env:V2_VERSION

      - name: Test packaged imports, UI, device selection and face backend
        shell: powershell
        run: |
          $exe = '.\dist\NiyomsilAIEnhancer\NiyomsilAIEnhancer.exe'
          .\tools\Test-V2-Package.ps1 -Exe $exe -OutputDir package-smoke -Mode imports -TimeoutSeconds 120
          .\tools\Test-V2-Package.ps1 -Exe $exe -OutputDir package-smoke -Mode ui
          .\tools\Test-V2-Package.ps1 -Exe $exe -OutputDir package-smoke -Mode face -TimeoutSeconds 120

      - name: Test real inference, large files and cancellation from packaged EXE
        shell: powershell
        run: .\tools\Test-V2-Package.ps1 -Exe '.\dist\NiyomsilAIEnhancer\NiyomsilAIEnhancer.exe' -OutputDir package-smoke -Mode processing -TimeoutSeconds 1200

      - name: Generate small download installer from checksummed payloads
        shell: powershell
        run: |
          python tools\generate_v2_download_installer.py --release-dir release --repository '${{ github.repository }}' --tag $env:V2_TAG --version $env:V2_VERSION --output build\installer_v2_download.iss --icon assets\app_icon.ico
          if ($LASTEXITCODE -ne 0) { throw 'Download installer generation failed' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          & $iscc '.\build\installer_v2_download.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Download installer compile failed' }
          Copy-Item '.\package-smoke\package-smoke.json' '.\release\PACKAGE_SMOKE.json'
          Copy-Item '.\dist\NiyomsilAIEnhancer\BUILD_PROOF.txt' '.\release\BUILD_PROOF.txt'
          Copy-Item '.\README_V2_TH.md' '.\release\README_V2_TH.md'
          Copy-Item '.\THIRD_PARTY_NOTICES.md' '.\release\THIRD_PARTY_NOTICES.md'
          Get-ChildItem '.\release\*' -File |
            Where-Object { $_.Extension -in '.exe', '.bin' } |
            ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" } |
            Set-Content '.\release\SHA256SUMS.txt' -Encoding ascii

      - name: Free build-only disk space
        shell: powershell
        run: |
          Remove-Item '.\.venv-build' -Recurse -Force
          Remove-Item '.\build' -Recurse -Force

      - name: Install verified full setup, test installed application and uninstall
        shell: powershell
        run: |
          $target = Join-Path $PWD 'installed-smoke'
          $args = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=$target /LOG=package-smoke\install.log"
          $process = Start-Process '.\release\NiyomSilp-Design-v2-Setup.exe' -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(600000)) { $process.Kill(); throw 'Installer timeout' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $target 'NiyomsilAIEnhancer.exe'
          .\tools\Test-V2-Package.ps1 -Exe $exe -OutputDir package-smoke\installed -Mode imports -TimeoutSeconds 120
          .\tools\Test-V2-Package.ps1 -Exe $exe -OutputDir package-smoke\installed -Mode processing -TimeoutSeconds 1200
          $uninstaller = Join-Path $target 'unins000.exe'
          $process = Start-Process $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw 'Uninstall timeout' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path $exe) { throw 'Installed application still exists after uninstall' }

      - name: Test small installer against verified local payloads
        shell: powershell
        run: |
          $payload = Join-Path $PWD 'release'
          $args = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /VERIFYONLY=1 /PAYLOADDIR=$payload /LOG=package-smoke\download-local.log"
          $process = Start-Process '.\release\NiyomSilp-Design-v2-Install.exe' -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(600000)) { $process.Kill(); throw 'Small installer timeout' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Small installer failed: $($process.ExitCode)" }

      - name: Upload verified installer and reports
        uses: actions/upload-artifact@v4
        with:
          name: NiyomSilp-Design-v2-Windows
          compression-level: 0
          path: release/*

      - name: Publish v2 prerelease download
        shell: powershell
        run: |
          $report = Get-Content '.\release\PACKAGE_SMOKE.json' -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.release.source_commit -ne '${{ github.sha }}') { throw 'Build report does not match source commit' }
          gh release view $env:V2_TAG --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to replace assets' }
          $notes = "NiyomSilp Design v2 $env:V2_VERSION`n`nDownload NiyomSilp-Design-v2-Install.exe and open it. It downloads and verifies the full offline payload automatically. Internet is needed for the first download; Python is bundled.`n`nWindows packaged and installed CPU tests passed, including real 2x/4x/8x inference, 16x target sizing, large image export/import and cancellation. CUDA/DirectML still require validation on shop hardware.`n`nSource: ${{ github.sha }}"
          $notes | Set-Content '.\package-smoke\release-notes.txt' -Encoding utf8
          $assets = @(Get-ChildItem '.\release\*' -File | ForEach-Object { $_.FullName })
          gh release create $env:V2_TAG @assets --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "NiyomSilp Design v2 $env:V2_VERSION — Windows test build" --notes-file '.\package-smoke\release-notes.txt' --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }

      - name: Verify real public download flow
        shell: powershell
        run: |
          $args = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /VERIFYONLY=1 /LOG=package-smoke\download-online.log'
          $process = Start-Process '.\release\NiyomSilp-Design-v2-Install.exe' -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(1200000)) { $process.Kill(); throw 'Online download timeout' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Online download verification failed: $($process.ExitCode)" }

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NiyomSilp-v2-diagnostics
          path: package-smoke/**
          if-no-files-found: ignore
