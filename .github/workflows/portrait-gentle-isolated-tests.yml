name: Portrait Gentle - Isolated Tests

on:
  push:
    branches:
      - dev-portrait-gentle-retouch-20261010
  workflow_dispatch:

jobs:
  stable-core-and-gentle-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pillow
      - name: Check syntax only (no AI models)
        run: |
          python -m py_compile \
            signprint_ai/app_v2.py \
            signprint_ai/arm_core_adapter.py \
            signprint_ai/processing.py \
            signprint_ai/face_module/face_protection.py \
            signprint_ai/face_module/portrait_gentle.py
      - name: Ensure proven AI core is pixel-path immutable
        run: python -m unittest discover -s tests -p "test_core_immutability.py" -v
      - name: Test portrait blend separately
        run: python -m unittest discover -s tests -p "test_portrait_gentle.py" -v
