name: Independent Core - Generic CMYK ICC Integration

on:
  push:
    branches:
      - dev-niyomsil-independent-core-20261010
    paths:
      - ".github/workflows/independent-core-generic-icc.yml"
      - "tools/run_generic_icc_integration.py"
      - "tools/run_shop_icc.py"
      - "independent_core/print_output.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-cmyk-tiff-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python==5.0.0.93
      - name: Install OS-provided generic CMYK ICC test profile (not shop ICC)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgs-common
          test -s /usr/share/color/icc/ghostscript/default_cmyk.icc
      - name: Validate RGB to CMYK TIFF with real ICC, compare unchanged ARM export
        run: |
          python tools/run_generic_icc_integration.py --icc /usr/share/color/icc/ghostscript/default_cmyk.icc --out generic-cmyk-test-evidence
      - name: Upload reports, RGB synthetic input, and CMYK sample TIFFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niyomsil-generic-cmyk-evidence-NOT-SHOP-PROFILE
          path: generic-cmyk-test-evidence/
          if-no-files-found: warn
          retention-days: 30
