name: Independent Core regression checks
on:
  pull_request:
  push:
    branches: [codex/niyomsil-independent-core, dev/niyomsil-design-v2]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy Pillow opencv-python-headless
      - run: python -m pytest -q
      - run: python -m compileall -q signprint_ai native_models run.py
