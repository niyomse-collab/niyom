name: V2.1.1 four-AI bridge Windows candidate
run-name: V2.1.1 Windows candidate - ${{ github.sha }}
on:
  pull_request:
    branches:
      - feature/v2.1.1-super-ai
    paths:
      - 'signprint_ai/**'
      - 'tools/v211_*.py'
      - 'tests/test_v211_*.py'
      - 'NiyomsilV2ArmCore.spec'
      - 'build_windows.ps1'
      - 'installer_v211_experimental.iss'
      - 'run.py'
      - 'requirements_v2_large_images.txt'
      - '.github/workflows/v211-four-engine-bridge-windows.yml'
      - '.github/workflows/v211-four-engine-manual-evidence.yml'
      - '.github/workflows/v211-four-engine-real-cli-smoke.yml'
  push:
    branches:
      - work/v211-four-engine-v2-bridge-20261103
    paths:
      - 'signprint_ai/**'
      - 'tools/v211_*.py'
      - 'tests/test_v211_*.py'
      - 'NiyomsilV2ArmCore.spec'
      - 'build_windows.ps1'
      - 'installer_v211_experimental.iss'
      - 'run.py'
      - 'requirements_v2_large_images.txt'
      - '.github/workflows/v211-four-engine-bridge-windows.yml'
      - '.github/workflows/v211-four-engine-manual-evidence.yml'
      - '.github/workflows/v211-four-engine-real-cli-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: niyomsil-v211-bridge-windows
  # Serialize the single V2.1.1 candidate lane, but cancel superseded commits.
  # This releases stale builds and lets the current Draft PR head build promptly.
  cancel-in-progress: true

jobs:
  bridge-tests:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'work/v211-four-engine-v2-bridge-20261103') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/work/v211-four-engine-v2-bridge-20261103') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/work/v211-four-engine-v2-bridge-20261103')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check source syntax
        shell: pwsh
        run: python -m compileall -q signprint_ai tools tests
      - name: Install bridge test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest numpy Pillow opencv-python-headless -r requirements_v2_large_images.txt
      - name: Verify V2 output preservation and four-engine coordination contracts
        shell: pwsh
        run: |
          python -m pytest -q tests/test_v211_four_engine_bridge.py tests/test_v211_four_engine_run.py tests/test_v211_four_engine_tiled_inference.py tests/test_v211_four_engine_safe_selection.py tests/test_v211_four_engine_subprocess.py tests/test_v211_hat_disabled_model_routing.py tests/test_v211_three_engine_priority_preview.py tests/test_v211_four_engine_fusion.py tests/test_v211_four_engine_autorun.py tests/test_v211_background_fusion.py tests/test_v211_auto_setup.py tests/test_v211_setup_cli.py tests/test_v211_isolated_installer.py tests/test_v211_real_inference_qa_coverage.py tests/test_v211_shop_gpu_diagnostic.py tests/test_v211_shop_gpu_workflow_contract.py tests/test_v211_gpu_device_binding.py tests/test_v211_gpu_process_telemetry.py
      - name: Verify privacy, model hashes and official provisioning contracts
        shell: pwsh
        run: |
          python -m pytest -q tests/test_v211_bridge_error_privacy.py tests/test_v211_official_assets_audit.py tests/test_v211_provision_four_engines.py tests/test_v211_manifest_hash_fail_closed.py tests/test_v211_model_preflight.py

  windows-v2-candidate:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'work/v211-four-engine-v2-bridge-20261103') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/work/v211-four-engine-v2-bridge-20261103') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/work/v211-four-engine-v2-bridge-20261103')
    needs: bridge-tests
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Windows installer compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build V2-based experimental candidate
        shell: powershell
        run: .\build_windows.ps1 -Channel v2 -Version 2.1.1-beta.${{ github.run_number }}
      - name: Check packaged V2 imports without claiming real four-engine inference
        shell: powershell
        run: |
          .\tools\Test-V2-Package.ps1 -Exe '.\dist\NiyomsilAIEnhancer\NiyomsilAIEnhancer.exe' -OutputDir package-smoke -Mode imports -TimeoutSeconds 180
      - name: Verify packaged four-engine provisioning dispatch without downloads
        shell: pwsh
        run: |
          $exe = '.\dist\NiyomsilAIEnhancer\NiyomsilAIEnhancer.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Packaged provisioning executable is missing.'
          }
          # This exercises the exact installer CLI route in the frozen EXE.
          # --check-only imports and validates the pinned provisioner graph;
          # it must not start network requests or modify LOCALAPPDATA.
          $process = Start-Process -FilePath $exe -ArgumentList @('--provision-v211-four-ai', '--check-only') -Wait -PassThru
          if ($null -eq $process -or $process.ExitCode -ne 0) {
            throw 'Packaged four-engine provisioning preflight failed.'
          }
          Write-Output 'Packaged four-engine provisioning dispatch passed without downloads.'

      - name: Verify packaged consented model-cache cleanup on isolated synthetic data
        shell: pwsh
        run: |
          $exe = '.\\dist\\NiyomsilAIEnhancer\\NiyomsilAIEnhancer.exe'
          # Isolate LOCALAPPDATA so the frozen cleanup command can prove it
          # refuses a different profile even when the path suffix looks valid.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'Profile\\AppData\\Local'
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'NiyomSilp\\V211-FourAI-QA'
          $archiveDir = Join-Path $cacheRoot 'archives'
          $engineDir = Join-Path $cacheRoot 'engines\\real-esrgan'
          New-Item -ItemType Directory -Force -Path $archiveDir, $engineDir | Out-Null
          Set-Content -LiteralPath (Join-Path $archiveDir 'synthetic.zip') -Value 'not a real archive'
          Set-Content -LiteralPath (Join-Path $engineDir 'model.bin') -Value 'synthetic placeholder'
          Set-Content -LiteralPath (Join-Path $cacheRoot 'manifest.json') -Value '{}'
          Set-Content -LiteralPath (Join-Path $cacheRoot 'operator-note.txt') -Value 'preserve unknown files'
          $process = Start-Process -FilePath $exe -ArgumentList @('--remove-v211-four-ai-assets', '--confirmed-by-user', '--data-root', $cacheRoot) -Wait -PassThru
          if ($null -eq $process -or $process.ExitCode -ne 0) {
            throw 'Packaged consented model-cache cleanup failed.'
          }
          foreach ($removed in @($archiveDir, (Join-Path $cacheRoot 'engines'), (Join-Path $cacheRoot 'manifest.json'))) {
            if (Test-Path -LiteralPath $removed) {
              throw "Packaged cleanup left an owned cache entry: $removed"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $cacheRoot 'operator-note.txt'))) {
            throw 'Packaged cleanup removed an unknown file; refusing broad deletion.'
          }

          $outsideRoot = Join-Path $env:RUNNER_TEMP 'OtherProfile\\AppData\\Local\\NiyomSilp\\V211-FourAI-QA'
          New-Item -ItemType Directory -Force -Path $outsideRoot | Out-Null
          $outsideSentinel = Join-Path $outsideRoot 'keep.txt'
          Set-Content -LiteralPath $outsideSentinel -Value 'must not be deleted'
          $outsideProcess = Start-Process -FilePath $exe -ArgumentList @('--remove-v211-four-ai-assets', '--confirmed-by-user', '--data-root', $outsideRoot) -Wait -PassThru
          if ($null -eq $outsideProcess -or $outsideProcess.ExitCode -eq 0) {
            throw 'Packaged cleanup accepted a cache path belonging to another profile.'
          }
          if (-not (Test-Path -LiteralPath $outsideSentinel -PathType Leaf)) {
            throw 'Packaged cleanup deleted data outside the current profile LocalAppData.'
          }
          Remove-Item -LiteralPath $outsideRoot -Recurse -Force

          Remove-Item -LiteralPath $cacheRoot -Recurse -Force
          Write-Output 'Packaged cleanup removed only approved cache entries, preserved unknown files, and rejected another profile.'
      - name: Verify packaged GTX 1660 Ti diagnostic command dispatch (help only)
        shell: pwsh
        run: |
          $exe = '.\dist\NiyomsilAIEnhancer\NiyomsilAIEnhancer.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Packaged diagnostic executable is missing.'
          }
          # This is a PyInstaller windowed (console=False) application. PowerShell
          # does not populate LASTEXITCODE for this GUI-subsystem process; wait on
          # the Process object and inspect its real exit code instead.
          $process = Start-Process -FilePath $exe -ArgumentList @('--diagnose-v211-four-ai', '--help') -Wait -PassThru
          if ($null -eq $process) {
            throw 'Packaged diagnostic help failed with exit code unavailable'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged diagnostic help failed with exit code $($process.ExitCode)"
          }
          Write-Output 'Packaged diagnostic dispatch exited successfully (code 0).'

      - name: Verify candidate provenance and every installer slice SHA256
        shell: pwsh
        run: |
          $proofPath = '.\dist\NiyomsilAIEnhancer\BUILD_PROOF.txt'
          $installer = '.\release\NiyomSilp-Design-v211-EXPERIMENTAL-Setup.exe'
          $sumsPath = '.\release\SHA256SUMS.txt'
          foreach ($required in @($proofPath, $installer, $sumsPath)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Candidate provenance input missing: $required"
            }
          }

          $proofLines = @(Get-Content -LiteralPath $proofPath)
          $sourceLine = $proofLines | Where-Object { $_ -match '^Source commit:[ ]*([0-9a-f]{40})[ ]*$' } | Select-Object -First 1
          if (-not $sourceLine) {
            throw 'BUILD_PROOF does not contain a valid source commit.'
          }
          $proofCommit = [regex]::Match($sourceLine, '[0-9a-f]{40}').Value.ToLowerInvariant()
          if ($proofCommit -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw 'BUILD_PROOF source commit does not match GITHUB_SHA.'
          }
          $headerLine = $proofLines | Where-Object { $_.Trim() -ceq 'NIYOMSIL DESIGN v2 - VERIFIED INSTALLER BUILD PROOF' } | Select-Object -First 1
          if (-not $headerLine) {
            throw 'BUILD_PROOF is not a V2 channel build.'
          }
          $versionLine = $proofLines | Where-Object { $_ -match '^Version:[ ]*2[.]1[.]1-beta[.][0-9]+[ ]*$' } | Select-Object -First 1
          if (-not $versionLine) {
            throw 'BUILD_PROOF version is not a V2.1.1 beta candidate.'
          }

          $verified = @()
          foreach ($line in Get-Content -LiteralPath $sumsPath) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') {
              throw 'SHA256SUMS contains a malformed entry.'
            }
            $expected = $Matches[1].ToLowerInvariant()
            $name = $Matches[2].Trim()
            if ([IO.Path]::GetFileName($name) -ne $name) {
              throw 'SHA256SUMS contains a non-local filename.'
            }
            $file = Join-Path '.\release' $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Installer slice listed in SHA256SUMS is missing."
            }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Installer slice SHA256 mismatch: $name"
            }
            $verified += [ordered]@{
              file = $name
              sha256 = $actual
              bytes = (Get-Item -LiteralPath $file).Length
            }
          }
          if ($verified.Count -lt 2) {
            throw 'Disk-spanning installer must include Setup.exe and at least one verified data slice.'
          }
          if (-not ($verified.file -contains [IO.Path]::GetFileName($installer))) {
            throw 'Setup.exe is not covered by SHA256SUMS.'
          }

          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $proofHash = (Get-FileHash -LiteralPath $proofPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = [ordered]@{
            schema_version = 1
            channel = 'v2.1.1-experimental'
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_number = $env:GITHUB_RUN_NUMBER
            installer_file = [IO.Path]::GetFileName($installer)
            installer_sha256 = $installerHash
            installer_bytes = (Get-Item -LiteralPath $installer).Length
            build_proof_sha256 = $proofHash
            frozen_import_smoke = 'passed'
            installer_slice_sha256_verified = $true
            installer_slices = $verified
            release_published = $false
            real_four_engine_inference_verified = $false
            shop_gpu_qa_verified = $false
            quality_certified = $false
          }
          $provenance | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath '.\release\CANDIDATE_PROVENANCE.json' -Encoding utf8

      - name: Upload experimental package; no release published
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NiyomSilp-V2.1.1-four-engine-bridge-EXPERIMENTAL
          compression-level: 0
          path: |
            release/NiyomSilp-Design-v211-EXPERIMENTAL-Setup*
            release/SHA256SUMS.txt
            release/CANDIDATE_PROVENANCE.json
            dist/NiyomsilAIEnhancer/BUILD_PROOF.txt
            docs/V211_FOUR_ENGINE_BRIDGE_BUILD_STATUS_TH.md
          if-no-files-found: error
          retention-days: 7
