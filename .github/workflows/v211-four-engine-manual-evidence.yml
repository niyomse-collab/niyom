name: V2.1.1 four-engine evidence gate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.1.1-super-ai
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit removal of active HAT references
        shell: pwsh
        run: python tools/v211_hat_reference_audit.py
      - name: Require independently approved assets
        shell: pwsh
        run: |
          if (-not (Test-Path env:V211_VERIFIED_MANIFEST)) {
            throw 'BLOCKED: no approved asset manifest provisioned on this runner; cannot claim four-engine inference'
          }
          if (-not (Test-Path env:V211_QA_SOURCE)) {
            throw 'BLOCKED: no approved test image provisioned on this runner'
          }
          if (-not (Test-Path $env:V211_VERIFIED_MANIFEST -PathType Leaf)) { throw 'Manifest missing' }
          if (-not (Test-Path $env:V211_QA_SOURCE -PathType Leaf)) { throw 'Source image missing' }
      - name: Run real inference (never mocks)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -m tools.v211_four_engine_real_inference_qa --manifest "$env:V211_VERIFIED_MANIFEST" --input "$env:V211_QA_SOURCE" --output-dir "$env:RUNNER_TEMP/v211-evidence"
      - name: Preserve failure or success report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v211-four-engine-evidence
          path: ${{ runner.temp }}/v211-evidence/real_inference_report.json
          if-no-files-found: warn
          retention-days: 7
