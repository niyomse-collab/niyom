name: V2.1.1 shop GPU evidence gate (manual, self-hosted)
on:
  # A push trigger makes the shop-only evidence gate usable while PR #20 stays Draft.
  # It is limited to this branch and QA-doc/workflow changes; the job still needs an explicit commit marker.
  push:
    branches:
      - work/v211-four-engine-v2-bridge-20261103
    paths:
      - '.github/workflows/v211-four-engine-manual-evidence.yml'
      - 'docs/V211_WINDOWS_REAL_FOUR_ENGINE_QA_TH.md'
  workflow_dispatch:
    inputs:
      confirm_shop_gpu:
        description: Run only on the dedicated Windows 11 shop PC with the verified four-engine installation.
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
      candidate_source_sha:
        description: Full 40-character source commit recorded in the installed candidate BUILD_PROOF.txt.
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: v211-shop-gpu-evidence
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.ref == 'refs/heads/work/v211-four-engine-v2-bridge-20261103' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.confirm_shop_gpu == 'yes' && inputs.candidate_source_sha != '') ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[shop-gpu-evidence yes candidate='))
      )
    runs-on: [self-hosted, Windows, X64, niyom-shop-gpu]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare Python for static source audit
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Verify installed candidate and local verified manifest
        id: preflight
        env:
          V211_CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $subkey = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\{4B6A2C18-0F95-47EE-A6B8-0F2DD7B0CE11}_is1'
          $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::CurrentUser,
            [Microsoft.Win32.RegistryView]::Registry64
          )
          try {
            $key = $base.OpenSubKey($subkey)
            if ($null -eq $key) { throw 'V2.1.1 experimental installation not found for this runner user.' }
            try { $installDir = [string]$key.GetValue('Inno Setup: App Path') }
            finally { $key.Dispose() }
          }
          finally { $base.Dispose() }
          if ([string]::IsNullOrWhiteSpace($installDir)) { throw 'Installed application path is missing.' }
          $exe = Join-Path $installDir 'NiyomsilAIEnhancer.exe'
          $proof = Join-Path $installDir 'BUILD_PROOF.txt'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Installed V2.1.1 executable is missing.' }
          if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) { throw 'Installed BUILD_PROOF.txt is missing.' }
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $expectedSha = ([string]$env:V211_CANDIDATE_SOURCE_SHA).ToLowerInvariant()
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $commitMessage = [string]$event.head_commit.message
            $marker = [regex]::Match($commitMessage, '\[shop-gpu-evidence\s+yes\s+candidate=([0-9a-fA-F]{40})\]')
            if (-not $marker.Success) {
              throw 'Push evidence requires explicit [shop-gpu-evidence yes candidate=<40-character-SHA>] consent in the commit message.'
            }
            $expectedSha = $marker.Groups[1].Value.ToLowerInvariant()
          } else {
            throw 'Unsupported event for shop GPU evidence.'
          }
          if ($expectedSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Candidate source SHA must be exactly 40 hexadecimal characters.'
          }
          git cat-file -e "${expectedSha}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source commit is not present in the checked-out history.' }
          git merge-base --is-ancestor $expectedSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Installed candidate source is not an ancestor of this branch revision.' }
          $changedFiles = @(git diff --name-only $expectedSha $env:GITHUB_SHA --)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare candidate source with the evidence trigger revision.' }
          $allowedFiles = @(
            '.github/workflows/v211-four-engine-manual-evidence.yml',
            'tests/test_v211_shop_gpu_workflow_contract.py',
            'docs/V211_WINDOWS_REAL_FOUR_ENGINE_QA_TH.md'
          )
          $unexpectedFiles = @($changedFiles | Where-Object { $_ -notin $allowedFiles })
          if ($unexpectedFiles.Count -gt 0) {
            throw ('Candidate is stale relative to non-document source changes: ' + ($unexpectedFiles -join ', '))
          }
          $proofText = Get-Content -LiteralPath $proof -Raw
          $proofPattern = '(?im)^Source commit:\s*' + [regex]::Escape($expectedSha) + '\s*$'
          if ($proofText -notmatch $proofPattern) { throw 'Installed candidate BUILD_PROOF does not match this workflow commit.' }
          if ([string]::IsNullOrWhiteSpace($env:LOCALAPPDATA)) { throw 'LOCALAPPDATA is unavailable for the shop runner user.' }
          $manifest = Join-Path $env:LOCALAPPDATA 'NiyomSilp\V211-FourAI-QA\manifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Verified four-engine manifest is missing from this Windows user profile.' }
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'v211-shop-evidence'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $identity = [ordered]@{
            source_commit = $expectedSha
            workflow_commit = $env:GITHUB_SHA
            workflow_event = $env:GITHUB_EVENT_NAME
            installed_executable_sha256 = $exeHash
            installed_executable_bytes = (Get-Item -LiteralPath $exe).Length
            verified_manifest_present = $true
            customer_artwork_used = $false
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $outputDir 'build_identity.json') -Encoding utf8
          @(
            ('V211_EXE_PATH=' + $exe),
            ('V211_MANIFEST_PATH=' + $manifest),
            ('V211_OUTPUT_DIR=' + $outputDir)
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Record static HAT reference audit (separate release gate)
        id: hat_audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $auditPath = Join-Path $env:V211_OUTPUT_DIR 'hat_audit.json'
          python tools/v211_hat_reference_audit.py | Set-Content -LiteralPath $auditPath -Encoding utf8
          $auditExit = [int]$LASTEXITCODE
          if (Test-Path -LiteralPath $auditPath -PathType Leaf) {
            $audit = Get-Content -LiteralPath $auditPath -Raw | ConvertFrom-Json
            $audit | Add-Member -NotePropertyName audit_exit_code -NotePropertyValue $auditExit -Force
            $audit | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $auditPath -Encoding utf8
          } else {
            [ordered]@{ status = 'ERROR'; audit_exit_code = $auditExit; reason = 'Audit report was not created.' } |
              ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $auditPath -Encoding utf8
          }
          Write-Output ('Static HAT audit status: ' + $audit.status + '; exit=' + $auditExit)

      - name: Run packaged synthetic-only GPU and four-engine bridge diagnostic
        id: diagnostic
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentLine = '--diagnose-v211-four-ai --manifest "{0}" --output-dir "{1}" --timeout-seconds 180' -f $env:V211_MANIFEST_PATH, $env:V211_OUTPUT_DIR
          $process = Start-Process -FilePath $env:V211_EXE_PATH -ArgumentList $argumentLine -Wait -PassThru
          $exitPath = Join-Path $env:V211_OUTPUT_DIR 'process_exit_code.txt'
          Set-Content -LiteralPath $exitPath -Value ([string]$process.ExitCode) -Encoding ascii
          if ($process.ExitCode -ne 0) { throw ('Shop GPU diagnostic failed with exit code ' + $process.ExitCode) }

      - name: Runtime physical-adapter telemetry — enforce fail-closed evidence and non-certification fields
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = $env:V211_OUTPUT_DIR
          $exitPath = Join-Path $outputDir 'process_exit_code.txt'
          if (-not (Test-Path -LiteralPath $exitPath -PathType Leaf)) { throw 'Diagnostic process exit record is missing.' }
          $exitCode = [int](Get-Content -LiteralPath $exitPath -Raw)
          if ($exitCode -ne 0) { throw ('Native four-engine diagnostic did not pass; exit code ' + $exitCode) }
          $reportPath = Join-Path $outputDir 'shop_gpu_diagnostic.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Shop GPU diagnostic JSON report is missing.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $requiredTrue = @(
            'manifest_preflight_passed',
            'device_binding_applied',
            'all_four_native_cli_outputs_validated_on_both_synthetic_cases',
            'four_engine_bridge_fusion_passed_on_gtx1660ti_configured_host',
            'runtime_device_use_verified',
            'shop_gpu_acceptance_passed'
          )
          foreach ($field in $requiredTrue) {
            if ($report.$field -ne $true) { throw ('Required QA field did not pass: ' + $field) }
          }
          $perEngine = $report.per_engine_runtime_device_use_verified
          $runtimeEvidence = $report.bridge_integration.runtime_process_evidence
          foreach ($engine in @('real_esrgan', 'waifu2x', 'real_cugan', 'anime4k')) {
            $engineEvidence = if ($null -ne $perEngine) { $perEngine.PSObject.Properties[$engine] } else { $null }
            if ($null -eq $engineEvidence -or $engineEvidence.Value -ne $true) {
              throw ('Physical adapter use is not verified for engine: ' + $engine)
            }
            $detailProperty = if ($null -ne $runtimeEvidence) { $runtimeEvidence.PSObject.Properties[$engine] } else { $null }
            if ($null -eq $detailProperty) { throw ('Runtime telemetry detail is missing for engine: ' + $engine) }
            $detail = $detailProperty.Value
            $processCount = [int]$detail.runtime_device_process_count
            $verifiedCount = [int]$detail.runtime_device_verified_process_count
            $sampleCount = [int]$detail.runtime_device_sample_count
            if ($processCount -lt 1 -or $verifiedCount -ne $processCount -or $sampleCount -lt $processCount) {
              throw ('Not every native child process has a live adapter sample: ' + $engine)
            }
            if ($detail.runtime_device_all_processes_verified -ne $true -or
                $detail.runtime_device_probe_conflict -ne $false -or
                $detail.runtime_device_probe_status -ne 'verified' -or
                [string]$detail.runtime_adapter_name -notmatch 'GTX 1660 Ti' -or
                $null -eq $detail.runtime_adapter_index -or
                @($detail.runtime_adapter_backend_apis).Count -lt 1) {
              throw ('Runtime physical-adapter telemetry is incomplete or conflicted for engine: ' + $engine)
            }
            $nvmlMemoryCount = [int]$detail.runtime_device_nvml_memory_verified_process_count
            $wddmPdhCount = [int]$detail.runtime_device_wddm_pdh_verified_process_count
            $evidenceSource = [string]$detail.runtime_device_evidence_source
            if ($nvmlMemoryCount -lt 0 -or $wddmPdhCount -lt 0 -or
                ($nvmlMemoryCount + $wddmPdhCount) -ne $processCount) {
              throw ('Per-process GPU evidence source counts do not cover every child process: ' + $engine)
            }
            $expectedSource = if ($nvmlMemoryCount -gt 0 -and $wddmPdhCount -gt 0) {
              'mixed'
            } elseif ($nvmlMemoryCount -gt 0) {
              'nvml_process_memory'
            } elseif ($wddmPdhCount -gt 0) {
              'nvml_pid_plus_windows_gpu_engine_pdh'
            } else {
              ''
            }
            if ($evidenceSource -ne $expectedSource) {
              throw ('Per-process GPU evidence source is missing or inconsistent: ' + $engine)
            }
            if ($wddmPdhCount -gt 0) {
              $minSamples = [int]$detail.runtime_gpu_engine_min_sample_count
              $minActive = [int]$detail.runtime_gpu_engine_min_active_sample_count
              $maxUtilization = [double]$detail.runtime_gpu_engine_max_utilization_percent
              $luidMatch = $detail.runtime_gpu_engine_adapter_luid_match
              $adapterLuid = [string]$detail.runtime_gpu_engine_adapter_luid
              if ($minSamples -lt 2 -or $minActive -lt 1 -or $maxUtilization -le 0 -or
                  $luidMatch -ne $true -or
                  $adapterLuid -notmatch '^0x[0-9a-fA-F]{8}_0x[0-9a-fA-F]{8}$') {
                throw ('WDDM GPU Engine activity or target DXGI LUID is not verified for every WDDM child process: ' + $engine)
              }
            }
          }
          if ($report.bridge_integration.runtime_device_use_verified -ne $true) {
            throw 'End-to-end bridge did not verify runtime physical-adapter use.'
          }
          $hatAuditPath = Join-Path $outputDir 'hat_audit.json'
          if (-not (Test-Path -LiteralPath $hatAuditPath -PathType Leaf)) {
            throw 'Static HAT audit report is missing; inspect the audit step.'
          }
          $hatAudit = Get-Content -LiteralPath $hatAuditPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$hatAudit.status)) {
            throw 'Static HAT audit report has no status.'
          }
          Write-Output ('Static HAT audit is a separate release gate: ' + $hatAudit.status)
          if ($report.customer_artwork_used -ne $false -or $report.network_accessed -ne $false -or $report.uploads_performed -ne $false -or $report.images_retained -ne $false) {
            throw 'Privacy invariant failed: customer imagery, network, upload or retained test images were reported.'
          }
          if ($report.quality_improvement_verified -ne $false -or $report.visual_quality_certified -ne $false -or $report.print_quality_certified -ne $false) {
            throw 'Synthetic GPU evidence must never certify visual or print quality.'
          }
          if ($report.bridge_integration.passed -ne $true -or $report.bridge_integration.device_binding_configured -ne $true -or $report.bridge_integration.pre_launch_vram_checks_passed -ne $true) {
            throw 'End-to-end bridge/fusion, device binding or per-process VRAM preflight did not pass.'
          }
          Write-Output 'PASS: all four native processes have per-engine physical-adapter telemetry on the selected GTX 1660 Ti. Synthetic evidence still does not certify visual or print quality.'

      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v211-shop-gpu-json-evidence
          path: |
            v211-shop-evidence/build_identity.json
            v211-shop-evidence/hat_audit.json
            v211-shop-evidence/shop_gpu_diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove local evidence workspace
        if: always()
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'v211-shop-evidence'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
) {
            throw 'Candidate source SHA must be exactly 40 hexadecimal characters.'
          }
          git cat-file -e "${expectedSha}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source commit is not present in the checked-out history.' }
          git merge-base --is-ancestor $expectedSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Installed candidate source is not an ancestor of this branch revision.' }
          $changedFiles = @(git diff --name-only $expectedSha $env:GITHUB_SHA --)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare candidate source with the evidence trigger revision.' }
          $unexpectedFiles = @($changedFiles | Where-Object { $_ -ne 'docs/V211_WINDOWS_REAL_FOUR_ENGINE_QA_TH.md' })
          if ($unexpectedFiles.Count -gt 0) {
            throw ('Candidate is stale relative to non-document source changes: ' + ($unexpectedFiles -join ', '))
          }
          $proofText = Get-Content -LiteralPath $proof -Raw
          $proofPattern = '(?im)^Source commit:\s*' + [regex]::Escape($expectedSha) + '\s*$'
          if ($proofText -notmatch $proofPattern) { throw 'Installed candidate BUILD_PROOF does not match this workflow commit.' }
          if ([string]::IsNullOrWhiteSpace($env:LOCALAPPDATA)) { throw 'LOCALAPPDATA is unavailable for the shop runner user.' }
          $manifest = Join-Path $env:LOCALAPPDATA 'NiyomSilp\V211-FourAI-QA\manifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Verified four-engine manifest is missing from this Windows user profile.' }
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'v211-shop-evidence'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $identity = [ordered]@{
            source_commit = $expectedSha
            installed_executable_sha256 = $exeHash
            installed_executable_bytes = (Get-Item -LiteralPath $exe).Length
            verified_manifest_present = $true
            customer_artwork_used = $false
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $outputDir 'build_identity.json') -Encoding utf8
          @(
            ('V211_EXE_PATH=' + $exe),
            ('V211_MANIFEST_PATH=' + $manifest),
            ('V211_OUTPUT_DIR=' + $outputDir)
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Record static HAT reference audit (separate release gate)
        id: hat_audit
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $auditPath = Join-Path $env:V211_OUTPUT_DIR 'hat_audit.json'
          python tools/v211_hat_reference_audit.py | Set-Content -LiteralPath $auditPath -Encoding utf8
          $auditExit = [int]$LASTEXITCODE
          if (Test-Path -LiteralPath $auditPath -PathType Leaf) {
            $audit = Get-Content -LiteralPath $auditPath -Raw | ConvertFrom-Json
            $audit | Add-Member -NotePropertyName audit_exit_code -NotePropertyValue $auditExit -Force
            $audit | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $auditPath -Encoding utf8
          } else {
            [ordered]@{ status = 'ERROR'; audit_exit_code = $auditExit; reason = 'Audit report was not created.' } |
              ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $auditPath -Encoding utf8
          }
          Write-Output ('Static HAT audit status: ' + $audit.status + '; exit=' + $auditExit)

      - name: Run packaged synthetic-only GPU and four-engine bridge diagnostic
        id: diagnostic
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentLine = '--diagnose-v211-four-ai --manifest "{0}" --output-dir "{1}" --timeout-seconds 180' -f $env:V211_MANIFEST_PATH, $env:V211_OUTPUT_DIR
          $process = Start-Process -FilePath $env:V211_EXE_PATH -ArgumentList $argumentLine -Wait -PassThru
          $exitPath = Join-Path $env:V211_OUTPUT_DIR 'process_exit_code.txt'
          Set-Content -LiteralPath $exitPath -Value ([string]$process.ExitCode) -Encoding ascii
          if ($process.ExitCode -ne 0) { throw ('Shop GPU diagnostic failed with exit code ' + $process.ExitCode) }

      - name: Runtime physical-adapter telemetry — enforce fail-closed evidence and non-certification fields
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = $env:V211_OUTPUT_DIR
          $exitPath = Join-Path $outputDir 'process_exit_code.txt'
          if (-not (Test-Path -LiteralPath $exitPath -PathType Leaf)) { throw 'Diagnostic process exit record is missing.' }
          $exitCode = [int](Get-Content -LiteralPath $exitPath -Raw)
          if ($exitCode -ne 0) { throw ('Native four-engine diagnostic did not pass; exit code ' + $exitCode) }
          $reportPath = Join-Path $outputDir 'shop_gpu_diagnostic.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Shop GPU diagnostic JSON report is missing.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $requiredTrue = @(
            'manifest_preflight_passed',
            'device_binding_applied',
            'all_four_native_cli_outputs_validated_on_both_synthetic_cases',
            'four_engine_bridge_fusion_passed_on_gtx1660ti_configured_host',
            'runtime_device_use_verified',
            'shop_gpu_acceptance_passed'
          )
          foreach ($field in $requiredTrue) {
            if ($report.$field -ne $true) { throw ('Required QA field did not pass: ' + $field) }
          }
          $perEngine = $report.per_engine_runtime_device_use_verified
          $runtimeEvidence = $report.bridge_integration.runtime_process_evidence
          foreach ($engine in @('real_esrgan', 'waifu2x', 'real_cugan', 'anime4k')) {
            $engineEvidence = if ($null -ne $perEngine) { $perEngine.PSObject.Properties[$engine] } else { $null }
            if ($null -eq $engineEvidence -or $engineEvidence.Value -ne $true) {
              throw ('Physical adapter use is not verified for engine: ' + $engine)
            }
            $detailProperty = if ($null -ne $runtimeEvidence) { $runtimeEvidence.PSObject.Properties[$engine] } else { $null }
            if ($null -eq $detailProperty) { throw ('Runtime telemetry detail is missing for engine: ' + $engine) }
            $detail = $detailProperty.Value
            $processCount = [int]$detail.runtime_device_process_count
            $verifiedCount = [int]$detail.runtime_device_verified_process_count
            $sampleCount = [int]$detail.runtime_device_sample_count
            if ($processCount -lt 1 -or $verifiedCount -ne $processCount -or $sampleCount -lt $processCount) {
              throw ('Not every native child process has a live adapter sample: ' + $engine)
            }
            if ($detail.runtime_device_all_processes_verified -ne $true -or
                $detail.runtime_device_probe_conflict -ne $false -or
                $detail.runtime_device_probe_status -ne 'verified' -or
                [string]$detail.runtime_adapter_name -notmatch 'GTX 1660 Ti' -or
                $null -eq $detail.runtime_adapter_index -or
                @($detail.runtime_adapter_backend_apis).Count -lt 1) {
              throw ('Runtime physical-adapter telemetry is incomplete or conflicted for engine: ' + $engine)
            }
            $nvmlMemoryCount = [int]$detail.runtime_device_nvml_memory_verified_process_count
            $wddmPdhCount = [int]$detail.runtime_device_wddm_pdh_verified_process_count
            $evidenceSource = [string]$detail.runtime_device_evidence_source
            if ($nvmlMemoryCount -lt 0 -or $wddmPdhCount -lt 0 -or
                ($nvmlMemoryCount + $wddmPdhCount) -ne $processCount) {
              throw ('Per-process GPU evidence source counts do not cover every child process: ' + $engine)
            }
            $expectedSource = if ($nvmlMemoryCount -gt 0 -and $wddmPdhCount -gt 0) {
              'mixed'
            } elseif ($nvmlMemoryCount -gt 0) {
              'nvml_process_memory'
            } elseif ($wddmPdhCount -gt 0) {
              'nvml_pid_plus_windows_gpu_engine_pdh'
            } else {
              ''
            }
            if ($evidenceSource -ne $expectedSource) {
              throw ('Per-process GPU evidence source is missing or inconsistent: ' + $engine)
            }
            if ($wddmPdhCount -gt 0) {
              $minSamples = [int]$detail.runtime_gpu_engine_min_sample_count
              $minActive = [int]$detail.runtime_gpu_engine_min_active_sample_count
              $maxUtilization = [double]$detail.runtime_gpu_engine_max_utilization_percent
              $luidMatch = $detail.runtime_gpu_engine_adapter_luid_match
              $adapterLuid = [string]$detail.runtime_gpu_engine_adapter_luid
              if ($minSamples -lt 2 -or $minActive -lt 1 -or $maxUtilization -le 0 -or
                  $luidMatch -ne $true -or
                  $adapterLuid -notmatch '^0x[0-9a-fA-F]{8}_0x[0-9a-fA-F]{8}$') {
                throw ('WDDM GPU Engine activity or target DXGI LUID is not verified for every WDDM child process: ' + $engine)
              }
            }
          }
          if ($report.bridge_integration.runtime_device_use_verified -ne $true) {
            throw 'End-to-end bridge did not verify runtime physical-adapter use.'
          }
          $hatAuditPath = Join-Path $outputDir 'hat_audit.json'
          if (-not (Test-Path -LiteralPath $hatAuditPath -PathType Leaf)) {
            throw 'Static HAT audit report is missing; inspect the audit step.'
          }
          $hatAudit = Get-Content -LiteralPath $hatAuditPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$hatAudit.status)) {
            throw 'Static HAT audit report has no status.'
          }
          Write-Output ('Static HAT audit is a separate release gate: ' + $hatAudit.status)
          if ($report.customer_artwork_used -ne $false -or $report.network_accessed -ne $false -or $report.uploads_performed -ne $false -or $report.images_retained -ne $false) {
            throw 'Privacy invariant failed: customer imagery, network, upload or retained test images were reported.'
          }
          if ($report.quality_improvement_verified -ne $false -or $report.visual_quality_certified -ne $false -or $report.print_quality_certified -ne $false) {
            throw 'Synthetic GPU evidence must never certify visual or print quality.'
          }
          if ($report.bridge_integration.passed -ne $true -or $report.bridge_integration.device_binding_configured -ne $true -or $report.bridge_integration.pre_launch_vram_checks_passed -ne $true) {
            throw 'End-to-end bridge/fusion, device binding or per-process VRAM preflight did not pass.'
          }
          Write-Output 'PASS: all four native processes have per-engine physical-adapter telemetry on the selected GTX 1660 Ti. Synthetic evidence still does not certify visual or print quality.'

      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v211-shop-gpu-json-evidence
          path: |
            v211-shop-evidence/build_identity.json
            v211-shop-evidence/hat_audit.json
            v211-shop-evidence/shop_gpu_diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove local evidence workspace
        if: always()
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'v211-shop-evidence'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
