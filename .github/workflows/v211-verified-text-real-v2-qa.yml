name: V2.1.1 exact Thai text vs official V2 proof (opt-in research)

on:
  push:
    branches: [feature/v2.1.1-super-ai]
    paths:
      - 'signprint_ai/v211_verified_text.py'
      - 'tools/v211_verified_text_real_v2_qa.py'
  workflow_dispatch:

jobs:
  actual-neural-v2-and-trusted-font:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system Thai fonts for RAQM proof (not distributed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-thai-tlwg
          fc-list :lang=th | head -3
      - name: Install isolated pinned V2 CPU runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' 'torchvision==0.20.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'spandrel==0.4.2' 'basicsr==1.4.2' 'realesrgan==0.3.0' --no-deps
          python -m pip install 'numpy==2.2.6' 'opencv-python-headless==4.12.0.88' 'Pillow==12.3.0' 'einops==0.8.1' 'safetensors==0.5.3' 'scikit-image==0.25.2' addict future lmdb pyyaml requests scipy tqdm yapf
      - name: Download official V2 Real-ESRGAN checkpoint with mandatory SHA256
        shell: python
        run: |
          from pathlib import Path
          import hashlib, urllib.request
          url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth"
          checkpoint = Path("models/RealESRGAN_x4plus.pth")
          checkpoint.parent.mkdir(parents=True, exist_ok=True)
          expected = "4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1"
          digest = hashlib.sha256()
          with urllib.request.urlopen(url, timeout=180) as src, checkpoint.open("wb") as dst:
            while chunk := src.read(1024*1024):
              digest.update(chunk)
              dst.write(chunk)
          if digest.hexdigest() != expected:
            checkpoint.unlink(missing_ok=True)
            raise RuntimeError("Original V2 checkpoint SHA mismatch")
          print("Pinned official accepted V2 model SHA256 verified")
      - name: Actual Real-ESRGAN V2 then exact Unicode/font research proof
        run: python -m tools.v211_verified_text_real_v2_qa
      - name: Preserve native high-resolution truth, V2 A-B and exact ROI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V211-Verified-Thai-Typography-RealV2-QA
          path: v211-verified-text-real-v2-proof/**
          if-no-files-found: warn
          retention-days: 14
      - name: Check non-regression outside ROI and substantial exact-text gain
        shell: python
        run: |
          import json
          from pathlib import Path
          r = json.loads(Path("v211-verified-text-real-v2-proof/SUMMARY.json").read_text(encoding="utf8"))
          assert r["outside_selected_text_pixel_identical_to_v2"], "Sign objects were altered"
          assert r["psnr_gain_db"] >= 1.0, "Insufficient overall gain"
          assert all(s["gain_db"] >= 2.0 for s in r["text_roi_scores"].values()), "Text did not beat the original V2"
          print("RESEARCH ONLY: exact supplied-font text improved; automatic image restoration/print still NOT certified")
